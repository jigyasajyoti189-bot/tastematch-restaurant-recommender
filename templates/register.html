<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>
Create Account · Taste Analyzer
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>


<body>


<main class="auth-page">


<div class="auth-shell">


<div class="auth-brand">

<div class="brand-mark">
TA
</div>

<strong>
TASTE ANALYZER
</strong>

</div>



<section class="auth-card">


<p class="eyebrow">
GET STARTED
</p>


<h1>
Create account
</h1>


<p class="muted">

Build your personal restaurant shortlist.

</p>



{% with messages =
    get_flashed_messages(
        with_categories=true
    )
%}

{% for category, message in messages %}

<div class="alert {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endwith %}



<form
    method="post"
    class="form-stack"
>


<div>

<label for="name">
Full name
</label>

<input
    id="name"
    name="name"
    type="text"
    placeholder="Your name"
    autocomplete="name"
    required
>

</div>



<div>

<label for="email">
Email address
</label>

<input
    id="email"
    name="email"
    type="email"
    placeholder="you@example.com"
    autocomplete="email"
    required
>

</div>



<div>

<label for="phone">
Phone
<span class="muted">
(optional)
</span>
</label>

<input
    id="phone"
    name="phone"
    type="tel"
    placeholder="+91 98765 43210"
    autocomplete="tel"
>

</div>



<div>

<label for="password">
Password
</label>

<input
    id="password"
    name="password"
    type="password"
    placeholder="Minimum 8 characters"
    autocomplete="new-password"
    minlength="8"
    required
>

</div>



<button
    class="btn primary large"
    type="submit"
>

Create account →

</button>


</form>



<p class="auth-footer">

Already have an account?

<a href="{{ url_for('login') }}">
Sign in
</a>

</p>


</section>


</div>


</main>


</body>

</html>
